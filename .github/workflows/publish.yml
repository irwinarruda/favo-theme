name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: VS Code Marketplace and Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun run check
      - run: bunx @vscode/vsce@4.1.0 package --no-dependencies --out favo-theme.vsix
        working-directory: vscode
      - run: bunx @vscode/vsce@4.1.0 publish --packagePath favo-theme.vsix --oidc --skip-duplicate
        working-directory: vscode
      - run: bunx ovsx@1.3.0 publish favo-theme.vsix --skip-duplicate
        working-directory: vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
