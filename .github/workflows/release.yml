name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag this run was dispatched on (gh workflow run release.yml --ref v1.2.3 -f tag=v1.2.3)
        required: true
        type: string

permissions:
  contents: read

# Never cancelled: a half-finished publish is worse than a slow one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      # GitHub runs this file as it is on the ref a run is dispatched from, so a
      # run started from a branch would follow that branch's steps while claiming
      # to ship the tag. refs/tags/ rather than the bare name, so a branch that
      # happens to be called v1.2.3 can't stand in for the tag either.
      - name: Check the run started from the tag
        run: |
          if [[ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "::error::This run started from ${GITHUB_REF}. Start it from the tag: gh workflow run release.yml --ref ${RELEASE_TAG} -f tag=${RELEASE_TAG}"
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the commit to release
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check contrast and generated files
        run: bun run check

      - name: Verify the tag matches both versions
        run: bun run check:release-version "${RELEASE_TAG}"

      # Written here because the jobs that can write have no checkout, and no repo
      # script should run next to a write token or a publishing identity.
      - name: Write the release notes from the changelog
        run: bun run release:notes "${RELEASE_TAG}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Package the extension
        working-directory: vscode
        run: bunx @vscode/vsce@4.1.0 package --no-dependencies --out "${RUNNER_TEMP}/favo-theme-${RELEASE_TAG#v}.vsix"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Upload the extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: ${{ runner.temp }}/favo-theme-*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist/release

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: dist/notes

      # This job has no checkout and `gh release create` goes by the tag's name, so
      # this is the last moment the tag can disagree with the commit verified above.
      # commits/refs/tags/ resolves an annotated tag to its commit as well.
      - name: Check the tag still points at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          tagged="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" --jq .sha)"
          if [[ "${tagged}" != "${RELEASE_SHA}" ]]; then
            echo "::error::${RELEASE_TAG} moved to ${tagged} during this run, but ${RELEASE_SHA} is what was verified"
            exit 1
          fi

      # A re-run reaches a release that is already published, so it is left alone.
      # A draft is not that: a failed upload leaves one behind, and creating the
      # release again finishes the job. --verify-tag stops gh from quietly creating
      # a missing tag on the default branch.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2> /dev/null || true)"
          if [[ "${is_draft}" == "false" ]]; then
            echo "${RELEASE_TAG} is already published, so its files stay as they are"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" dist/release/* \
            --notes-file dist/notes/release-notes.md \
            --title "${RELEASE_TAG}" \
            --verify-tag \
            --repo "${GITHUB_REPOSITORY}"

  # The file the GitHub Release holds is the file both stores get. The Marketplace
  # trusts this workflow by its file name, through a Trusted Publishing policy on
  # the publisher page, so renaming release.yml breaks publishing.
  publish:
    name: Publish to the VS Code Marketplace and Open VSX
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist

      - name: Publish to the VS Code Marketplace
        run: bunx @vscode/vsce@4.1.0 publish --packagePath "dist/favo-theme-${RELEASE_TAG#v}.vsix" --oidc --skip-duplicate

      # An empty token falls through to trusted publishing, so deleting this secret
      # is all it takes to move off it.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bunx ovsx@1.3.0 publish "dist/favo-theme-${RELEASE_TAG#v}.vsix" --skip-duplicate
